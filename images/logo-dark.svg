<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#5b64ff"/>
  <!-- Simple protein helix: two interleaving sine-wave strands -->
  <path d="M6 10 Q10 6 14 10 Q18 14 22 10 Q26 6 28 10" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M4 16 Q8 12 12 16 Q16 20 20 16 Q24 12 28 16" stroke="#00b8a9" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M6 22 Q10 18 14 22 Q18 26 22 22 Q26 18 28 22" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- connecting rungs -->
  <line x1="14" y1="10" x2="12" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
  <line x1="22" y1="10" x2="20" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
  <line x1="10" y1="14" x2="10" y2="20" stroke="rgba(0,184,169,0.5)" stroke-width="1.2"/>
  <line x1="14" y1="22" x2="12" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
  <line x1="22" y1="22" x2="20" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
</svg>
