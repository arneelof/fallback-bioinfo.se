<text x="60" y="550.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">1  Zinken hjälper vattnet att lämna ifrån sig en proton; kvar blir en negativ hydroxidjon.</text>
<text x="60" y="578.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">2  Hydroxidjonen angriper koldioxiden, och bikarbonat bildas.</text>
<text x="60" y="606.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">3  Protonen förs via vattenkedjan till histidinen, som svänger ut och lämnar den till vätskan.</text>
