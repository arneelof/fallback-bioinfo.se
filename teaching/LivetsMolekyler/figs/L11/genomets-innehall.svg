<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330">
<defs></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="430" y="28.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Vad människans genom består av (ungefärliga procent)</text>
<text x="330" y="75.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="end" font-weight="normal" fill="#222222">kodar för proteiner (exoner)</text>
<rect x="345" y="55" width="13.5" height="30" rx="3" fill="#f4d4d0" stroke="#b5443b" stroke-width="1.5"/>
<text x="368.5" y="75.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">1–2 %</text>
<text x="330" y="117.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="end" font-weight="normal" fill="#222222">övriga delar av gener (främst introner)</text>
<rect x="345" y="97" width="225" height="30" rx="3" fill="#f8e1c8" stroke="#d9822b" stroke-width="1.5"/>
<text x="580" y="117.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">ca 25 %</text>
<text x="330" y="159.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="end" font-weight="normal" fill="#222222">transposoner</text>
<rect x="345" y="139" width="405" height="30" rx="3" fill="#e6dcf0" stroke="#7a4f9a" stroke-width="1.5"/>
<text x="760" y="159.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">ca 45 %</text>
<text x="330" y="201.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="end" font-weight="normal" fill="#222222">stora duplikationer</text>
<rect x="345" y="181" width="45" height="30" rx="3" fill="#cfe0f3" stroke="#3b6ea8" stroke-width="1.5"/>
<text x="400" y="201.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">ca 5 %</text>
<text x="330" y="243.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="end" font-weight="normal" fill="#222222">enkla upprepningar</text>
<rect x="345" y="223" width="27" height="30" rx="3" fill="#cfe0f3" stroke="#3b6ea8" stroke-width="1.5"/>
<text x="382" y="243.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">ca 3 %</text>
<text x="330" y="285.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="end" font-weight="normal" fill="#222222">övrigt DNA mellan generna</text>
<rect x="345" y="265" width="180" height="30" rx="3" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/>
<text x="535" y="285.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">ca 20 %</text>
</svg>
