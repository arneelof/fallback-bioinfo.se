<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330">
<defs><marker id="ah666666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="430" y="28.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Hur långt bakåt har människans proteiner släktingar?</text>
<text x="320" y="74.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" font-weight="normal" fill="#222222">släktingar finns</text>
<text x="320" y="92.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" font-weight="normal" fill="#222222">även hos bakterier</text>
<rect x="335" y="60" width="252" height="36" rx="3" fill="#f4d4d0" stroke="#b5443b" stroke-width="1.5"/>
<text x="597" y="83.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">21 %</text>
<text x="320" y="132.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" font-weight="normal" fill="#222222">hos jäst, växter m.fl.,</text>
<text x="320" y="150.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" font-weight="normal" fill="#222222">men inte hos bakterier</text>
<rect x="335" y="118" width="384" height="36" rx="3" fill="#f8e1c8" stroke="#d9822b" stroke-width="1.5"/>
<text x="729" y="141.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">32 %</text>
<text x="320" y="190.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" font-weight="normal" fill="#222222">hos andra djur, t.ex. insekter,</text>
<text x="320" y="208.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" font-weight="normal" fill="#222222">men inte hos jäst och växter</text>
<rect x="335" y="176" width="288" height="36" rx="3" fill="#d6ecd2" stroke="#4a8c4a" stroke-width="1.5"/>
<text x="633" y="199.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">24 %</text>
<text x="320" y="257.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" font-weight="normal" fill="#222222">bara hos ryggradsdjur</text>
<rect x="335" y="234" width="264" height="36" rx="3" fill="#cfe0f3" stroke="#3b6ea8" stroke-width="1.5"/>
<text x="609" y="257.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#222222">22 %</text>
<path d="M40,70 L40,270" fill="none" stroke="#666666" stroke-width="2" marker-end="url(#ah666666)"/>
<text x="40" y="56.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#666666">äldst</text>
<text x="40" y="296.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#666666">yngst</text>
<text x="430" y="319.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic" fill="#666666">Andel av människans proteiner. Resten, omkring 1 %, är svåra att placera.</text>
</svg>
