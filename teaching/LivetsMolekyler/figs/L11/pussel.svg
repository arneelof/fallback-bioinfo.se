<rect x="300" y="170" width="110" height="14" rx="3" fill="#cfe0f3" stroke="#3b6ea8" stroke-width="1.5"/>
<text x="225" y="215.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Datorn letar efter överlappande bitar …</text>
<path d="M225,228 L225,262" fill="none" stroke="#3b6ea8" stroke-width="3" marker-end="url(#ah3b6ea8)"/>
<rect x="40" y="272" width="370" height="18" rx="3" fill="#3b6ea8" stroke="#3b6ea8" stroke-width="1.5"/>
<text x="225" y="317.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">… och fogar ihop dem till en lång sekvens</text>
<text x="225" y="385.9" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#3b6ea8">Referenssekvens</text>
<text x="225" y="409.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">(människans genom 2001: år av arbete)</text>
<text x="675" y="55.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">En ny persons DNA läses i korta bitar</text>
