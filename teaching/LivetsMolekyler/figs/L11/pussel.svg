<text x="675" y="325.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#b5443b">Skillnader mot referensen (röda)</text>
<text x="675" y="347.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#b5443b">är det som gör personen unik</text>
<text x="675" y="385.9" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#d9822b">Ett personligt genom</text>
<text x="675" y="409.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">(i dag: några timmar till dagar)</text>
