<text x="130" y="323.1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">1. En oveckad kedja</text>
<text x="130" y="339.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">fastnar på de vattenskygga</text>
<text x="130" y="356.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">kanterna av den öppna ringen</text>
<text x="470" y="323.1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">2. Locket (GroES) sätts på.</text>
<text x="470" y="339.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">Insidan blir vattenälskande, och</text>
<text x="470" y="356.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">kedjan veckar sig i skydd</text>
<text x="800" y="323.1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">3. Locket släpper och</text>
<text x="800" y="339.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">proteinet kommer ut. Är det inte</text>
<text x="800" y="356.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">färdigt får det börja om</text>
<text x="58" y="194.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#3b6ea8">GroEL</text>
<text x="470" y="124.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4a8c4a">GroES</text>
