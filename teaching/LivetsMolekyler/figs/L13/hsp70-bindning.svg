<text x="470" y="413.1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Ett sådant ställe finns i genomsnitt ungefär</text>
<text x="470" y="429.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">var 36:e aminosyra, men i ett färdigt</text>
<text x="470" y="446.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">protein ligger det oftast gömt inuti.</text>
