<text x="590" y="466.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#b5443b">Cancerläkemedel som geldanamycin sätter sig där ATP ska binda:</text>
<text x="590" y="482.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#b5443b">klämman kan inte slutas, och klienten mognar inte.</text>
