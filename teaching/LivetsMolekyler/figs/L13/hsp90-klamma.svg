<text x="910" y="69.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#3b6ea8">3. ATP spjälkas: klämman öppnas</text>
<ellipse cx="910" cy="372" rx="34" ry="20" fill="#d6ecd2" stroke="#4a8c4a" stroke-width="2.5"/>
<text x="910" y="376.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">färdig</text>
