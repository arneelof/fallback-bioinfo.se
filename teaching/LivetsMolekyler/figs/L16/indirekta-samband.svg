<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330">
<defs></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="430" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Direkta och indirekta samband</text>
<line x1="240" y1="250" x2="430" y2="110" stroke="#7a4f9a" stroke-width="5"/>
<line x1="430" y1="110" x2="620" y2="250" stroke="#7a4f9a" stroke-width="5"/>
<line x1="240" y1="250" x2="620" y2="250" stroke="#b5443b" stroke-width="3" stroke-dasharray="6,4"/>
<circle cx="240" cy="250" r="30" fill="#e6dcf0" stroke="#7a4f9a" stroke-width="3"/>
<text x="240" y="257.7" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222">A</text>
<circle cx="430" cy="110" r="30" fill="#e6dcf0" stroke="#7a4f9a" stroke-width="3"/>
<text x="430" y="117.7" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222">B</text>
<circle cx="620" cy="250" r="30" fill="#e6dcf0" stroke="#7a4f9a" stroke-width="3"/>
<text x="620" y="257.7" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222">C</text>
<text x="290" y="165.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" font-weight="bold" fill="#7a4f9a">i kontakt</text>
<text x="570" y="165.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#7a4f9a">i kontakt</text>
<text x="430" y="271.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#b5443b">ser ut att samevolvera,</text>
<text x="430" y="289.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#b5443b">men är inte i kontakt</text>
<text x="430" y="319.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="italic" fill="#666666">De nya statistiska metoderna räknar bort sådana indirekta samband.</text>
</svg>
