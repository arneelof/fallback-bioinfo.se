<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
<defs></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="480" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Tre klassiska vägar från sekvens till struktur</text>
<text x="165" y="72.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#4a8c4a">Homologimodellering</text>
<text x="165" y="100.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">En nära släkting</text>
<text x="165" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">med känd struktur</text>
<rect x="25" y="132" width="280" height="200" rx="10" fill="#d6ecd2" stroke="#4a8c4a" stroke-width="2"/>
<text x="165" y="365.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">Låna formen</text>
<text x="165" y="404.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4a8c4a">säkrast</text>
<text x="480" y="72.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#d9822b">Trådning</text>
<text x="480" y="100.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">Ingen synlig släkting,</text>
<text x="480" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">men formen kan finnas</text>
