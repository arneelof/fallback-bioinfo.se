<text x="795" y="100.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">Ingen känd form</text>
<text x="795" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">passar</text>
<rect x="655" y="132" width="280" height="200" rx="10" fill="#f4d4d0" stroke="#b5443b" stroke-width="2"/>
<text x="795" y="356.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">Pussla ihop</text>
<text x="795" y="374.2" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">korta bitar</text>
<text x="795" y="404.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="italic" fill="#b5443b">bara små proteiner</text>
